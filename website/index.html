<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalShop</title>

<meta name="description" content="QR Based Digital Shop Platform">

<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/utilities.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/home.css">
</head>

<body>

<div id="app">

<header class="header">
  <div class="container header-container">
    <a href="/" class="logo">
      <img src="assets/images/logo.svg" alt="LocalShop">
    </a>

    <nav class="desktop-nav">
      <a href="/">Home</a>
      <a href="/search">Search</a>
      <a href="/merchant">Merchant</a>
      <a href="/about">About</a>
    </nav>

    <button id="menuButton" class="menu-button" aria-label="Open Menu">☰</button>
  </div>
</header>

<main>

<section class="hero">
  <div class="container">
    <h1>Discover Nearby Local Shops</h1>
    <p>Scan QR or Search Shop ID to view live prices and offers.</p>

    <form id="searchForm">
      <input id="shopIdInput" type="text" placeholder="Enter Shop ID">
      <button type="submit">Search Shop</button>
    </form>

    <div class="hero-actions">
      <a href="/scan" class="btn btn-primary">Scan QR</a>
      <a href="/search" class="btn btn-secondary">Browse Shops</a>
    </div>
  </div>
</section>

<section class="categories">
  <div class="container">
    <h2>Categories</h2>
    <div id="categoryGrid" class="category-grid"></div>
  </div>
</section>

<section class="popular-shops">
  <div class="container">
    <h2>Popular Shops</h2>
    <div id="popularShopList"></div>
  </div>
</section>

<section class="recent-shops">
  <div class="container">
    <h2>Recent Shops</h2>
    <div id="recentShopList"></div>
  </div>
</section>

<section class="offers">
  <div class="container">
    <h2>Latest Offers</h2>
    <div id="offerList"></div>
  </div>
</section>

</main>

<footer class="footer">
  <div class="container">
    <p>&copy; 2026 LocalShop. All rights reserved.</p>
  </div>
</footer>

<div id="loader" hidden></div>
<div id="toastContainer"></div>
<div id="modalRoot"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/home.js"></script>

</body>
</html>
